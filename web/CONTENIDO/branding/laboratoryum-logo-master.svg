  <g>
    <text x="700" y="1175" text-anchor="middle" font-family="'IBM Plex Mono','Avenir Next Condensed','Menlo',monospace" font-size="76" letter-spacing="7" fill="#d7ffe7">LABORATORYUM</text>
    <text x="700" y="1224" text-anchor="middle" font-family="'IBM Plex Mono','Menlo',monospace" font-size="20" letter-spacing="5" fill="#4fa36a">EVIDENCE · CONTEXT · MEMORY</text>
  </g>
