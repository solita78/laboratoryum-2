<svg width="1800" height="520" viewBox="0 0 1800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glitch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#050807"/>
      <rect y="3" width="6" height="3" fill="#08120e"/>
    </pattern>
  </defs>

  <rect width="1800" height="520" fill="url(#scan)"/>

  <g font-family="Menlo, 'Courier New', monospace" font-size="150" font-weight="700" letter-spacing="2">
    <text x="199" y="284" fill="#12b874" filter="url(#glitch)">&gt;_ LABORATORYUM</text>
    <text x="208" y="286" fill="#6fffc0" filter="url(#glitch)">&gt;_ LABORATORYUM</text>
    <text x="203" y="285" fill="#28e38f" filter="url(#glow)">&gt;_ LABORATORYUM</text>
  </g>

  <line x1="298" y1="332" x2="1520" y2="332" stroke="#28e38f" stroke-width="7"/>
</svg>
