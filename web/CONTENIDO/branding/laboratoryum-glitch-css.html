<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laboratoryum Glitch CSS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: #02070a;
      --text: #2af0a4;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--background);
      overflow: hidden;
      font-family: "IBM Plex Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .logo {
      font-size: clamp(30px, 3.9vw, 46px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.005em;
      color: var(--text);
      transform: scale(1.14, 0.9);
      transform-origin: center;
      text-shadow: 0 0 5px rgba(42, 240, 164, 0.34);
      white-space: nowrap;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    .cyber-glitch {
      position: relative;
      display: inline-block;
    }

    .cyber-glitch::before,
    .cyber-glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--background);
      overflow: hidden;
      pointer-events: none;
    }

    .cyber-glitch::before {
      left: 2px;
      text-shadow: -1px 0 #ff00ff;
      clip-path: inset(0 0 0 0);
      animation: glitch-anim-1 2s infinite linear alternate-reverse;
      opacity: 0.82;
    }

    .cyber-glitch::after {
      left: -2px;
      text-shadow: -1px 0 #00d4ff;
      clip-path: inset(0 0 0 0);
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
      opacity: 0.82;
    }


    .cyber-scanlines {
      background: linear-gradient(to bottom, #fff0, #fff0 50%, #0003 50%, #0003);
      background-size: 100% 4px;
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      opacity: .15;
    }

    @keyframes glitch-anim-1 {
      0% { clip-path: inset(8% 0 78% 0); transform: translateX(0); }
      8% { clip-path: inset(70% 0 12% 0); transform: translateX(-1px); }
      16% { clip-path: inset(38% 0 44% 0); transform: translateX(1px); }
      24% { clip-path: inset(4% 0 86% 0); transform: translateX(-2px); }
      32% { clip-path: inset(60% 0 20% 0); transform: translateX(1px); }
      40% { clip-path: inset(18% 0 66% 0); transform: translateX(0); }
      48% { clip-path: inset(76% 0 8% 0); transform: translateX(2px); }
      56% { clip-path: inset(30% 0 50% 0); transform: translateX(-1px); }
      64% { clip-path: inset(54% 0 24% 0); transform: translateX(1px); }
      72% { clip-path: inset(12% 0 74% 0); transform: translateX(-1px); }
      80% { clip-path: inset(66% 0 16% 0); transform: translateX(2px); }
      88% { clip-path: inset(42% 0 34% 0); transform: translateX(-2px); }
      100% { clip-path: inset(0 0 0 0); transform: translateX(0); }
    }

    @keyframes glitch-anim-2 {
      0% { clip-path: inset(72% 0 10% 0); transform: translateX(0); }
      10% { clip-path: inset(20% 0 64% 0); transform: translateX(1px); }
      20% { clip-path: inset(48% 0 28% 0); transform: translateX(-1px); }
      30% { clip-path: inset(6% 0 82% 0); transform: translateX(2px); }
      40% { clip-path: inset(58% 0 18% 0); transform: translateX(-2px); }
      50% { clip-path: inset(34% 0 42% 0); transform: translateX(1px); }
      60% { clip-path: inset(80% 0 6% 0); transform: translateX(-1px); }
      70% { clip-path: inset(14% 0 70% 0); transform: translateX(2px); }
      80% { clip-path: inset(44% 0 30% 0); transform: translateX(-2px); }
      90% { clip-path: inset(62% 0 14% 0); transform: translateX(1px); }
      100% { clip-path: inset(0 0 0 0); transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="logo cyber-glitch" data-text="laboratoryum">laboratoryum</div>
    </div>
  </div>
  <div class="cyber-scanlines"></div>
</body>
</html>
